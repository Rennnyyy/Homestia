name: build-and-deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/rennnyyy/homestia
  APP_SLUG: homestia
  # Authenticated on both stages.
  APP_PUBLIC: false
  SSH_HOST: 159.195.109.128
  SSH_USER: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Homestia
      - uses: actions/checkout@v4
        with:
          repository: Rennnyyy/Aletheia
          path: Aletheia
          token: ${{ secrets.ALETHEIA_PAT }}
      - name: Tests
        run: |
          echo "No tests wired for Homestia yet. Add dotnet test here."

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The Dockerfile's build context must be the parent of Aletheia/ and
      # Homestia/ (it project-references the Aletheia SDK), so check both
      # repos out side by side and build from the workspace root.
      - uses: actions/checkout@v4
        with:
          path: Homestia
      - uses: actions/checkout@v4
        with:
          repository: Rennnyyy/Aletheia
          path: Aletheia
          token: ${{ secrets.ALETHEIA_PAT }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Homestia/Homestia/deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ github.sha }}
          APP_PUBLIC: "false"
        run: bash scripts/deploy.sh staging

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ github.sha }}
          APP_PUBLIC: "false"
        run: bash scripts/deploy.sh prod
