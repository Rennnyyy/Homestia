name: build-and-deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rennnyyy/homestia
  APP_SLUG: homestia
  # Authenticated on both stages.
  APP_PUBLIC: false
  SSH_HOST: 159.195.109.128
  SSH_USER: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: Homestia

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The frontend packages live in the Aletheia repo's GitHub Packages feed,
      # so the npm registry needs the PAT (read:packages) — a GITHUB_TOKEN from
      # this repo cannot read another repo's packages.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@rennnyyy"

      - name: Authenticate the Aletheia NuGet feed
        working-directory: Homestia/Homestia
        run: |
          dotnet nuget update source github \
            --source https://nuget.pkg.github.com/rennnyyy/index.json \
            --username rennnyyy \
            --password "${{ secrets.ALETHEIA_PAT }}" \
            --store-password-in-clear-text

      - name: Restore
        working-directory: Homestia/Homestia
        run: dotnet restore Homestia.slnx

      # Bruno.Tests drives a live host through the Bruno CLI — it is a manual
      # integration suite, not a CI unit gate, so the three offline suites run.
      - name: Backend tests
        working-directory: Homestia/Homestia
        run: |
          dotnet test tests/Program.Tests/Homestia.Tests.csproj --no-restore -p:SkipAngularBuild=true
          dotnet test tests/Entities.Tests/Homestia.Entities.Tests.csproj --no-restore -p:SkipAngularBuild=true
          dotnet test tests/Capabilities.Tests/Homestia.Capabilities.Tests.csproj --no-restore -p:SkipAngularBuild=true

      - name: Frontend dependencies
        working-directory: Homestia/Homestia/src/Web/App
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ALETHEIA_PAT }}
        run: npm ci

      - name: Generated-code drift gate
        working-directory: Homestia/Homestia/src/Web/App
        run: npm run codegen:check

      - name: Frontend tests + coverage floors
        working-directory: Homestia/Homestia/src/Web/App
        run: npm run test:coverage

      - name: Frontend build
        working-directory: Homestia/Homestia/src/Web/App
        run: npm run build

      - name: Publish frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: homestia-wwwroot
          path: Homestia/Homestia/src/Program/wwwroot

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The Docker build context is the Homestia repo only — the Aletheia SDK is
      # restored as NuGet packages from the GitHub Packages feed (nuget.config in
      # the repo). ALETHEIA_PAT is only used as NuGet feed credentials while the
      # Aletheia packages are private; it is ignored (empty) once they are public.
      - uses: actions/checkout@v4
        with:
          path: Homestia
      # The facade was built once in the `test` job; the image reuses it
      # (SKIP_ANGULAR=true) so Node never runs inside the Docker build.
      - uses: actions/download-artifact@v4
        with:
          name: homestia-wwwroot
          path: Homestia/Homestia/src/Program/wwwroot
      # The image consumes the Aletheia SDK version pinned in
      # Directory.Build.props — one deliberate bump per SDK upgrade, no dynamic
      # version resolution.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Homestia/Homestia/deploy/Dockerfile
          push: true
          build-args: |
            NUGET_USERNAME=rennnyyy
            NUGET_PASSWORD=${{ secrets.ALETHEIA_PAT }}
            NPM_TOKEN=${{ secrets.ALETHEIA_PAT }}
            SKIP_ANGULAR=true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ github.sha }}
          APP_PUBLIC: "false"
          # GraphDB connection — DEPLOY_ prefix is stripped on the server.
          DEPLOY_GraphDb__RepositoryId: ${{ secrets.DEPLOY_GraphDb__RepositoryId }}
          DEPLOY_GraphDb__Username: ${{ secrets.DEPLOY_GraphDb__Username }}
          DEPLOY_GraphDb__Password: ${{ secrets.DEPLOY_GraphDb__Password }}
          # AI API keys — DEPLOY_ prefix is stripped on the server.
          DEPLOY_AI__Default__ApiKey: ${{ secrets.DEPLOY_AI__Default__ApiKey }}
          DEPLOY_AI__ModelRoles__formfill__ApiKey: ${{ secrets.DEPLOY_AI__ModelRoles__formfill__ApiKey }}
        run: bash scripts/deploy.sh staging

  deploy-prod:
    # Strict semver tags only — a prerelease (vX.Y.Z-rc) must never reach prod.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ github.sha }}
          APP_PUBLIC: "false"
          # GraphDB connection — DEPLOY_ prefix is stripped on the server.
          DEPLOY_GraphDb__RepositoryId: ${{ secrets.DEPLOY_GraphDb__RepositoryId }}
          DEPLOY_GraphDb__Username: ${{ secrets.DEPLOY_GraphDb__Username }}
          DEPLOY_GraphDb__Password: ${{ secrets.DEPLOY_GraphDb__Password }}
          # AI API keys — DEPLOY_ prefix is stripped on the server.
          DEPLOY_AI__Default__ApiKey: ${{ secrets.DEPLOY_AI__Default__ApiKey }}
          DEPLOY_AI__ModelRoles__formfill__ApiKey: ${{ secrets.DEPLOY_AI__ModelRoles__formfill__ApiKey }}
        run: bash scripts/deploy.sh prod
