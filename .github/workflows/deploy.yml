name: build-and-deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/rennnyyy/homestia
  APP_SLUG: homestia
  # Authenticated on both stages.
  APP_PUBLIC: false
  SSH_HOST: 159.195.109.128
  SSH_USER: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Homestia
      - name: Tests
        run: |
          echo "No tests wired for Homestia yet. Add dotnet test here."

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The Docker build context is the Homestia repo only — the Aletheia SDK is
      # restored as NuGet packages from the GitHub Packages feed (nuget.config in
      # the repo). ALETHEIA_PAT is only used as NuGet feed credentials while the
      # Aletheia packages are private; it is ignored (empty) once they are public.
      - uses: actions/checkout@v4
        with:
          path: Homestia
      # Ride the latest Aletheia CI build: resolve its newest -ci.* package version
      # from the feed and pass it to the Docker build as ALETHEIA_SDK_VERSION.
      # If resolution fails (no token / no CI build yet) the Docker build falls
      # back to the committed AletheiaSdkVersion default in Directory.Build.props.
      - name: Resolve latest Aletheia CI version
        env:
          ALETHEIA_PAT: ${{ secrets.ALETHEIA_PAT }}
        run: |
          VER="$(bash Homestia/scripts/resolve-aletheia-version.sh 2>/dev/null || true)"
          if [ -n "${VER:-}" ]; then
            echo "ALETHEIA_SDK_VERSION=${VER}" >> "$GITHUB_ENV"
            echo "Riding latest Aletheia CI: ${VER}"
          else
            echo "No Aletheia CI version resolved - using committed AletheiaSdkVersion default."
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Homestia/Homestia/deploy/Dockerfile
          push: true
          build-args: |
            NUGET_USERNAME=rennnyyy
            NUGET_PASSWORD=${{ secrets.ALETHEIA_PAT }}
            ALETHEIA_SDK_VERSION=${{ env.ALETHEIA_SDK_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ github.sha }}
          APP_PUBLIC: "false"
          # GraphDB connection — DEPLOY_ prefix is stripped on the server.
          DEPLOY_GraphDb__RepositoryId: ${{ secrets.DEPLOY_GraphDb__RepositoryId }}
          DEPLOY_GraphDb__Username: ${{ secrets.DEPLOY_GraphDb__Username }}
          DEPLOY_GraphDb__Password: ${{ secrets.DEPLOY_GraphDb__Password }}
          # AI API keys — DEPLOY_ prefix is stripped on the server.
          DEPLOY_AI__Default__ApiKey: ${{ secrets.DEPLOY_AI__Default__ApiKey }}
          DEPLOY_AI__ModelRoles__formfill__ApiKey: ${{ secrets.DEPLOY_AI__ModelRoles__formfill__ApiKey }}
        run: bash scripts/deploy.sh staging

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ github.sha }}
          APP_PUBLIC: "false"
          # GraphDB connection — DEPLOY_ prefix is stripped on the server.
          DEPLOY_GraphDb__RepositoryId: ${{ secrets.DEPLOY_GraphDb__RepositoryId }}
          DEPLOY_GraphDb__Username: ${{ secrets.DEPLOY_GraphDb__Username }}
          DEPLOY_GraphDb__Password: ${{ secrets.DEPLOY_GraphDb__Password }}
          # AI API keys — DEPLOY_ prefix is stripped on the server.
          DEPLOY_AI__Default__ApiKey: ${{ secrets.DEPLOY_AI__Default__ApiKey }}
          DEPLOY_AI__ModelRoles__formfill__ApiKey: ${{ secrets.DEPLOY_AI__ModelRoles__formfill__ApiKey }}
        run: bash scripts/deploy.sh prod
