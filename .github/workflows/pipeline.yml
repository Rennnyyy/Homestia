name: pipeline

# ── Homestia single pipeline ───────────────────────────────────────────────
# One workflow runs the whole chain on every push to main and on release-
# shaped tags (vX.Y.Z final, or vX.Y.Z-rc* candidate):
#
#   frontend-build-test ──> backend-build-test ──> image-build ──> deploy
#
# BOTH test jobs must be green before the Docker image is built; deploy runs
# after the image build (transitively gated on both green suites).
#
# The Angular facade (Homestia.Frontend) is built EXACTLY ONCE in
# `frontend-build-test` and shared as the `homestia-wwwroot` artifact; the
# image build reuses it with SKIP_ANGULAR=true, so Node never runs inside the
# Docker build. The compiled Sdk.Web admin (/aletheia) is delivered by the
# Aletheia.Sdk.Web package's own build targets during `dotnet publish`.
#
# workflow_dispatch = manual deploy (staging): rebuilds the image, deploys.
#
# Stage resolution: only a final vX.Y.Z tag deploys to prod; rc tags, main and
# manual runs go to staging. Both stages stay behind Authentik (APP_PUBLIC is
# always false — the opposite of Aletheia, whose prod is public).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rennnyyy/homestia
  APP_SLUG: homestia
  # Authenticated on both stages.
  APP_PUBLIC: "false"
  SSH_HOST: 159.195.109.128
  SSH_USER: deploy

jobs:
  # ── Frontend build + tests: single owner of the npm world ─────────────────
  frontend-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The frontend packages live in the Aletheia repo's GitHub Packages feed,
      # so the npm registry needs the PAT (read:packages) — a GITHUB_TOKEN from
      # this repo cannot read another repo's packages.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Homestia.Frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@rennnyyy"

      - name: Frontend dependencies
        working-directory: Homestia.Frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ALETHEIA_PAT }}
        run: npm ci

      - name: Generated-code drift gate
        working-directory: Homestia.Frontend
        run: npm run codegen:check

      - name: Frontend tests + coverage floors
        working-directory: Homestia.Frontend
        run: npm run test:coverage

      - name: Frontend build
        working-directory: Homestia.Frontend
        run: npm run build

      - name: Publish frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: homestia-wwwroot
          path: Homestia/src/Program/wwwroot
          if-no-files-found: error

  # ── Backend build + tests ─────────────────────────────────────────────────
  backend-build-test:
    needs: frontend-build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate the Aletheia NuGet feed
        working-directory: Homestia
        run: |
          dotnet nuget update source github \
            --source https://nuget.pkg.github.com/rennnyyy/index.json \
            --username rennnyyy \
            --password "${{ secrets.ALETHEIA_PAT }}" \
            --store-password-in-clear-text

      - name: Restore
        working-directory: Homestia
        run: dotnet restore Homestia.slnx

      # Bruno.Tests drives a live host through the Bruno CLI — it is a manual
      # integration suite, not a CI unit gate, so the three offline suites run.
      - name: Backend tests
        working-directory: Homestia
        run: |
          dotnet test tests/Program.Tests/Homestia.Tests.csproj --no-restore -p:SkipAngularBuild=true
          dotnet test tests/Entities.Tests/Homestia.Entities.Tests.csproj --no-restore -p:SkipAngularBuild=true
          dotnet test tests/Capabilities.Tests/Homestia.Capabilities.Tests.csproj --no-restore -p:SkipAngularBuild=true

  # ── Docker image (ghcr.io/rennnyyy/homestia) ──────────────────────────────
  image-build:
    needs: [frontend-build-test, backend-build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      stage: ${{ steps.resolve.outputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage
        id: resolve
        run: |
          # Only a final vX.Y.Z tag deploys to prod; rc tags and main go to
          # staging (release candidates must not hit the live environment).
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STAGE="prod"
          else
            STAGE="staging"
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Building $STAGE image ${IMAGE}:${GITHUB_SHA}"

      # Reuse the facade built by `frontend-build-test` — SKIP_ANGULAR=true
      # tells the Dockerfile to embed this wwwroot instead of rebuilding
      # Angular in-container.
      - uses: actions/download-artifact@v4
        with:
          name: homestia-wwwroot
          path: Homestia/src/Program/wwwroot

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image consumes the Aletheia SDK version pinned in
      # Homestia/Directory.Build.props — one deliberate bump per SDK upgrade,
      # no dynamic version resolution. ALETHEIA_PAT is only used as registry
      # credentials while the Aletheia packages are private.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          build-args: |
            NUGET_USERNAME=rennnyyy
            NUGET_PASSWORD=${{ secrets.ALETHEIA_PAT }}
            NPM_TOKEN=${{ secrets.ALETHEIA_PAT }}
            SKIP_ANGULAR=true
          # Immutable sha tag + rolling stage tag (staging/prod) that
          # deploy.sh pins via APP_VERSION.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.resolve.outputs.stage }}

  # ── Server deploy (Netcup VPS) ────────────────────────────────────────────
  deploy:
    needs: image-build
    runs-on: ubuntu-latest
    environment: ${{ needs.image-build.outputs.stage }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to ${{ needs.image-build.outputs.stage }}
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ github.sha }}
          APP_PUBLIC: ${{ env.APP_PUBLIC }}
          # GraphDB connection — DEPLOY_ prefix is stripped on the server.
          DEPLOY_GraphDb__RepositoryId: ${{ secrets.DEPLOY_GraphDb__RepositoryId }}
          DEPLOY_GraphDb__Username: ${{ secrets.DEPLOY_GraphDb__Username }}
          DEPLOY_GraphDb__Password: ${{ secrets.DEPLOY_GraphDb__Password }}
          # AI API keys — DEPLOY_ prefix is stripped on the server.
          DEPLOY_AI__Default__ApiKey: ${{ secrets.DEPLOY_AI__Default__ApiKey }}
          DEPLOY_AI__ModelRoles__formfill__ApiKey: ${{ secrets.DEPLOY_AI__ModelRoles__formfill__ApiKey }}
        run: bash deployment/scripts/deploy.sh "${{ needs.image-build.outputs.stage }}"
