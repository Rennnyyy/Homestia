<div class="flex flex-col overflow-hidden" style="height: 100dvh;">
  <!-- Header — one bar for every breakpoint. On a phone it holds the menu
       button, the brand and the two chrome buttons; the rail carries the rest. -->
  <header class="border-b border-border bg-card shrink-0 z-50 flex items-center gap-2 px-4 md:px-6 py-3">
    <button
      hlmBtn
      variant="ghost"
      size="icon-sm"
      (click)="sidebarOpen.set(true)"
      class="md:hidden text-muted-foreground hover:text-foreground"
      [attr.aria-label]="'nav.menu' | transloco"
    >
      <svg lucideMenu class="size-5"></svg>
    </button>

    <div class="flex items-center gap-2 min-w-0 flex-1">
      <!-- The mark yields to the wordmark on the narrowest screens: the title
           is the one element that must survive a 320px bar intact. -->
      <svg lucideHouse class="hidden sm:block size-7 text-primary shrink-0"></svg>
      <h1 class="text-lg sm:text-xl md:text-2xl font-bold tracking-tight text-foreground truncate">
        {{ 'app.title' | transloco }}
      </h1>
    </div>

    <!-- The chrome axis: accent, then mode, then language. The accent cycler is
         three controls wide — the rail's 64px icon strip could never hold it,
         so it lives here with the other chrome, on every breakpoint. -->
    <app-theme-picker />

    <!-- Dark / light — one button, no skin selector: Homestia ships a single
         skin, so there is nothing to cycle through. -->
    <button
      hlmBtn
      variant="ghost"
      size="icon-sm"
      (click)="theme.toggleDark()"
      class="text-muted-foreground hover:text-foreground"
      [attr.aria-pressed]="theme.isDark()"
      [attr.aria-label]="(theme.isDark() ? 'theme.light' : 'theme.dark') | transloco"
    >
      @if (theme.isDark()) {
        <svg lucideMoon class="size-4"></svg>
      } @else {
        <svg lucideSun class="size-4"></svg>
      }
    </button>

    <aletheia-language-switcher />

    <!-- Who this browser acts as, in a development build only: the request declares it through the
         SDK's simulation header, which is what makes two agents (and their two landlords)
         comparable in one browser. A production bundle renders nothing here. -->
    <aletheia-agent-simulation-switcher />

    <button
      hlmBtn
      variant="ghost"
      size="icon-sm"
      class="ml-1 rounded-full size-8 bg-primary/10 text-primary text-xs font-bold hover:bg-primary/20 hidden sm:inline-flex"
    >
      RR
    </button>
  </header>

  <!-- Body: the SDK rail + the routed page -->
  <div class="flex flex-1 overflow-hidden">
    <aletheia-sidebar
      [sections]="sections"
      [mobileOpen]="sidebarOpen()"
      (mobileOpenChange)="sidebarOpen.set($event)"
      [(collapsed)]="railCollapsed"
    >
    </aletheia-sidebar>

    <main class="flex-1 overflow-y-auto bg-background">
      <router-outlet />
    </main>
  </div>
</div>
