# fly.toml — Fly.io configuration for Homestia (Real Estate Platform)
# App: homestia  →  https://homestia.fly.dev

app            = "homestia"
primary_region = "ams"

[build]
  # Build context: Katharsis/ (contains both Aletheia/SDK/ and Homestia/Homestia/)
  context    = "../../.."
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0
  processes            = ["app"]

  [[http_service.checks]]
    interval     = "10s"
    timeout      = "5s"
    grace_period = "15s"
    method       = "get"
    path         = "/"
    protocol     = "http"

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
