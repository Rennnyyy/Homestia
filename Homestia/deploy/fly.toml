# fly.toml — Fly.io configuration for Homestia
# App: homestia  →  https://homestia.fly.dev

app = "homestia"
primary_region = "ams"

[build]
  # Path relative to the build context (Katharsis/ parent directory)
  dockerfile = "Homestia/Homestia/deploy/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "15s"
    method = "get"
    path = "/"
    protocol = "http"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
