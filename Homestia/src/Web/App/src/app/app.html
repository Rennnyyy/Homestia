<div class="h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-border bg-card shrink-0 z-50">
    <div class="flex items-center px-6 py-3 gap-2">
      <!-- Burger (mobile only) -->
      <button
        hlmBtn
        variant="ghost"
        size="icon-sm"
        class="md:hidden -ml-2 text-muted-foreground hover:text-foreground shrink-0"
        (click)="sidebarOpen.set(true)"
      >
        <svg lucideMenu class="size-5"></svg>
      </button>

      <div class="flex items-center gap-3">
        <svg lucideHouse class="hidden md:block size-7 text-primary shrink-0"></svg>
        <h1 class="text-lg md:text-2xl font-bold tracking-tight text-foreground">
          {{ 'app.title' | transloco }}
        </h1>
      </div>

      <div class="flex-1"></div>

      <app-theme-picker />

      <button
        hlmBtn
        variant="ghost"
        size="icon-xs"
        (click)="toggleLang()"
        class="text-muted-foreground hover:text-foreground text-xs font-medium"
      >
        {{ currentLang() === 'en' ? 'EN' : 'DE' }}
      </button>

      <button
        hlmBtn
        variant="ghost"
        size="icon-sm"
        class="ml-2 rounded-full size-8 bg-primary/10 text-primary text-xs font-bold hover:bg-primary/20"
      >
        RR
      </button>
    </div>
  </header>

  <!-- Body: sidebar + content -->
  <div class="flex flex-1 overflow-hidden">
    <app-sidebar
      [mobileOpen]="sidebarOpen()"
      (mobileOpenChange)="sidebarOpen.set($event)"
    />
    <main class="flex-1 overflow-y-auto bg-background">
      <router-outlet />
    </main>
  </div>
</div>
