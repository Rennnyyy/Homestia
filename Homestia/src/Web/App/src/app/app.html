<div class="h-screen flex flex-col">
  <!-- Header (desktop) -->
  <header class="border-b border-border bg-card shrink-0 z-50 hidden md:block">
    <div class="flex items-center px-6 py-3 gap-2">
      <div class="flex items-center gap-3">
        <svg lucideHouse class="size-7 text-primary shrink-0"></svg>
        <h1 class="text-2xl font-bold tracking-tight text-foreground">
          {{ 'app.title' | transloco }}
        </h1>
      </div>

      <div class="flex-1"></div>

      <app-theme-picker />

      <button
        hlmBtn
        variant="ghost"
        size="icon-xs"
        (click)="toggleLang()"
        class="text-muted-foreground hover:text-foreground text-xs font-medium"
      >
        {{ currentLang() === 'en' ? 'EN' : 'DE' }}
      </button>

      <button
        hlmBtn
        variant="ghost"
        size="icon-sm"
        class="ml-2 rounded-full size-8 bg-primary/10 text-primary text-xs font-bold hover:bg-primary/20"
      >
        RR
      </button>
    </div>
  </header>

  <!-- Body: sidebar + content -->
  <div class="flex flex-1 overflow-hidden">
    <app-sidebar
      [mobileOpen]="sidebarOpen()"
      [currentLang]="currentLang()"
      (mobileOpenChange)="sidebarOpen.set($event)"
      (toggleLang)="toggleLang()"
    />
    <main class="flex-1 overflow-y-auto bg-background">
      <router-outlet />
    </main>
  </div>

  <!-- Mobile footer navigation -->
  <footer class="md:hidden border-t border-border bg-card shrink-0 z-50">
    <div class="flex items-center justify-evenly" style="padding: 10px 0;">
      <button
        hlmBtn
        variant="ghost"
        class="text-muted-foreground hover:text-foreground"
        (click)="sidebarOpen.set(true)"
        style="padding: 10px;"
      >
        <svg lucideMenu class="size-7"></svg>
      </button>
      <a routerLink="/" routerLinkActive="text-primary" [routerLinkActiveOptions]="{ exact: true }" class="text-muted-foreground hover:text-foreground" (click)="sidebarOpen.set(false)" style="padding: 10px;">
        <svg lucideHouse class="size-7"></svg>
      </a>
      <a routerLink="/properties" routerLinkActive="text-primary" class="text-muted-foreground hover:text-foreground" (click)="sidebarOpen.set(false)" style="padding: 10px;">
        <svg lucideBuilding class="size-7"></svg>
      </a>
      <a routerLink="/tenants" routerLinkActive="text-primary" class="text-muted-foreground hover:text-foreground" (click)="sidebarOpen.set(false)" style="padding: 10px;">
        <svg lucideUsers class="size-7"></svg>
      </a>
    </div>
  </footer>
</div>
