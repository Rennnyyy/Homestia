<!--
  EntityRefSelect — a real dropdown of existing entities with feedback states
  and an optional inline "create new" action. The select is never replaced by
  a bare IRI text input: while loading it shows a placeholder option, and on
  failure it shows an error with a retry button.
-->
<div class="flex flex-col gap-1.5">
  <div class="flex items-start gap-2">
    <select
      [id]="fieldId()"
      class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="disabled() || loading()"
      [value]="value()"
      (change)="onChange($event)">
      @if (loading()) {
        <option value="" disabled>{{ 'entityRefSelect.loading' | transloco }}</option>
      } @else {
        <option value="">{{ placeholderKey() | transloco }}</option>
        @for (opt of options(); track opt.iri) {
          <option [value]="opt.iri">{{ opt.displayValue }}</option>
        }
      }
    </select>

    @if (allowCreate() && !disabled()) {
      <button
        type="button"
        class="inline-flex h-10 shrink-0 items-center gap-1 rounded-md border border-input bg-background px-3 text-sm font-medium text-foreground hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
        (click)="create.emit()">
        <svg lucidePlus class="size-4"></svg>
        {{ createLabelKey() | transloco }}
      </button>
    }
  </div>

  @if (loading()) {
    <p class="text-xs text-muted-foreground">{{ 'entityRefSelect.loading' | transloco }}</p>
  } @else if (error(); as err) {
    <p class="text-[0.8rem] font-medium text-destructive flex items-center gap-1">
      <span>{{ err | transloco }}</span>
      <button type="button" class="underline underline-offset-2" (click)="load()">{{ 'entityRefSelect.retry' | transloco }}</button>
    </p>
  } @else if (hint(); as hint) {
    <p class="text-xs text-muted-foreground">{{ hint | transloco }}</p>
  }
</div>
