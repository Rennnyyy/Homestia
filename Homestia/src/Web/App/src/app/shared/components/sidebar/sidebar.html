<!-- Mobile backdrop overlay -->
@if (mobileOpen()) {
  <div
    class="fixed inset-0 bg-black/50 z-40 md:hidden"
    (click)="closeMobile()"
  ></div>
}

<aside
  class="h-full border-r border-border bg-card flex flex-col shrink-0 z-50
         w-56 md:relative md:transition-all md:duration-300
         fixed inset-y-0 left-0 transition-transform duration-300
         md:translate-x-0"
  [class.md:w-14]="collapsed()"
  [class.md:w-56]="!collapsed()"
  [class.-translate-x-full]="!mobileOpen()"
>
  <!-- Mobile header: theme + language (right-aligned) -->
  <div class="flex items-center h-14 px-3 md:hidden gap-1">
    <span class="text-lg font-medium text-primary">{{ 'nav.menu' | transloco }}</span>
    <div class="flex-1"></div>
    <app-theme-picker />
    <button
      hlmBtn
      variant="ghost"
      size="icon-xs"
      (click)="toggleLang.emit()"
      class="text-muted-foreground hover:text-foreground text-xs font-medium"
    >
      {{ currentLang() === 'en' ? 'EN' : 'DE' }}
    </button>
  </div>

  <!-- Divider -->
  <div class="border-t border-border mx-3 md:hidden"></div>

  <!-- Nav items -->
  <nav class="flex flex-col gap-0.5 p-2 pt-1 md:pt-2 flex-1">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-muted text-foreground font-medium"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors"
        (click)="closeMobile()"
      >
        <span class="shrink-0 inline-flex">
          @if (item.label === 'nav.home') {
            <svg lucideHouse class="size-5"></svg>
          } @else if (item.label === 'nav.properties') {
            <svg lucideBuilding class="size-5"></svg>
          } @else {
            <svg lucideUsers class="size-5"></svg>
          }
        </span>
        @if (!collapsed()) {
          <span class="truncate">{{ item.label | transloco }}</span>
        }
      </a>
    }
  </nav>

  <!-- Bottom bar: close on mobile, collapse on desktop -->
  <div class="flex items-center h-14 px-3 border-t border-border shrink-0">
    <button
      hlmBtn
      variant="ghost"
      size="icon-sm"
      (click)="closeMobile()"
      class="md:hidden text-muted-foreground hover:text-foreground"
    >
      <svg lucideX class="size-5"></svg>
    </button>

    <!-- Desktop collapse toggle -->
    <button
      hlmBtn
      variant="ghost"
      size="icon-sm"
      (click)="toggleCollapse()"
      class="hidden md:flex text-muted-foreground hover:text-foreground"
    >
      @if (collapsed()) {
        <svg lucidePanelLeft class="size-4"></svg>
      } @else {
        <svg lucidePanelLeftClose class="size-4"></svg>
      }
    </button>
    @if (!collapsed()) {
      <span class="hidden md:block ml-2 text-sm font-medium text-foreground truncate">{{ 'nav.menu' | transloco }}</span>
    }
  </div>
</aside>
