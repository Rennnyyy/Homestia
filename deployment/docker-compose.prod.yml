services:
  app:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EntityRepository__Backend: GraphDb
      GraphDb__BaseUrl: http://graphdb:7200
      # Per-app canonical IRI root — mirrors the Traefik host below.
      Entity__BaseIri: https://${APP_SLUG}.katharsis.digital
      # Branch options MUST mirror Entity__BaseIri (crash-loop guard, same
      # rationale as the Aletheia pipeline).
      Branch__DefaultBranchIri: https://${APP_SLUG}.katharsis.digital/branches/main
      Branch__ManagementGraphIri: https://${APP_SLUG}.katharsis.digital/management
    # `format: raw` DISABLES Compose's env-file interpolation. Without it a `$` inside any
    # secret value is silently expanded when the container starts (e.g. a GraphDB password
    # containing `$w9p` arrives empty), so the credential just fails auth while the file on
    # disk still looks correct. Requires Compose >= 2.24.
    env_file:
      - path: .env.prod
        format: raw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_SLUG}-prod.rule=Host(`${APP_SLUG}.katharsis.digital`)"
      - "traefik.http.routers.${APP_SLUG}-prod.entrypoints=websecure"
      - "traefik.http.routers.${APP_SLUG}-prod.tls.certresolver=myresolver"
      - "traefik.http.routers.${APP_SLUG}-prod.middlewares=authentik@docker"
      - "traefik.http.services.${APP_SLUG}-prod.loadbalancer.server.port=8080"
