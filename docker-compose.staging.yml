services:
  app:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EntityRepository__Backend: GraphDb
      GraphDb__BaseUrl: http://graphdb:7200
      # Per-app canonical IRI root — mirrors the Traefik host below.
      Entity__BaseIri: https://${APP_SLUG}.staging.katharsis.digital
      # Branch options MUST mirror Entity__BaseIri (crash-loop guard, same
      # rationale as the Aletheia pipeline).
      Branch__DefaultBranchIri: https://${APP_SLUG}.staging.katharsis.digital/branches/main
      Branch__ManagementGraphIri: https://${APP_SLUG}.staging.katharsis.digital/management
    env_file: .env.staging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_SLUG}-staging.rule=Host(`${APP_SLUG}.staging.katharsis.digital`)"
      - "traefik.http.routers.${APP_SLUG}-staging.entrypoints=websecure"
      - "traefik.http.routers.${APP_SLUG}-staging.tls.certresolver=myresolver"
      - "traefik.http.routers.${APP_SLUG}-staging.middlewares=authentik@docker"
      - "traefik.http.services.${APP_SLUG}-staging.loadbalancer.server.port=8080"
